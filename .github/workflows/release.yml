name: Release

# Every tag builds the Linux archive; a tag also publishes it as a GitHub release
# (the notes come from that version's CHANGELOG section). workflow_dispatch runs
# the build alone and leaves the archive as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET: x86_64-unknown-linux-gnu
  ASSET: justfeed-x86_64-unknown-linux-gnu.tar.xz

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          set -eu
          staging="justfeed-$TARGET"
          mkdir -p "dist/$staging"
          install -m 0755 target/release/justfeed "dist/$staging/justfeed"
          cp README.md CHANGELOG.md LICENSE "dist/$staging/"
          tar -cJf "dist/$ASSET" -C dist "$staging"
          rm -rf "dist/$staging"
          cp scripts/install.sh dist/justfeed-installer.sh
          ( cd dist && sha256sum "$ASSET" > "$ASSET.sha256" )
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

      - name: Release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          awk -v h="## [$version]" '
            index($0, h) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > dist/release-notes.md
          [ -s dist/release-notes.md ] || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          cat dist/release-notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file dist/release-notes.md \
            "dist/$ASSET" "dist/$ASSET.sha256" dist/justfeed-installer.sh
